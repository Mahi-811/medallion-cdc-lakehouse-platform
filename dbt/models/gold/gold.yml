version: 2

models:
  - name: dim_date
    description: "Calendar date dimension spanning 2024-2028 with day of week, weekends, holidays, and fiscal periods."
    columns:
      - name: date_key
        description: "Primary key in ISO date format (YYYY-MM-DD)."
        tests:
          - unique
          - not_null
      - name: year
        tests:
          - not_null
      - name: month
        tests:
          - not_null
      - name: is_weekend
        tests:
          - not_null

  - name: dim_customer
    description: "Slowly Changing Dimension Type 2 (SCD2) tracking historical customer profile evolutions."
    columns:
      - name: customer_sk
        description: "Surrogate key uniquely identifying each historical customer version."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Natural source customer identifier."
        tests:
          - not_null
      - name: valid_from
        description: "Timestamp when this record version became active."
        tests:
          - not_null
      - name: valid_to
        description: "Timestamp when this record version was superseded (or 9999-12-31)."
        tests:
          - not_null
      - name: is_current
        description: "Flag indicating whether this is the current active version."
        tests:
          - not_null

  - name: dim_product
    description: "Conformed dimensional catalog with unit costs, margins, and active inventory levels."
    columns:
      - name: product_id
        description: "Primary key of the product dimension."
        tests:
          - unique
          - not_null
      - name: sku
        tests:
          - unique
          - not_null
      - name: unit_cost
        tests:
          - not_null
      - name: list_price
        tests:
          - not_null

  - name: fact_orders
    description: "Core transactional fact table at the order line grain, enriched with SCD2 customer context and weather."
    columns:
      - name: order_sk
        description: "Surrogate primary key for the fact record."
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: order_date_key
        description: "Foreign key joining to dim_date."
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: customer_id
        description: "Natural customer key."
        tests:
          - not_null
      - name: product_id
        description: "Foreign key joining to dim_product."
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_id
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: ['PENDING', 'PROCESSING', 'SHIPPED', 'DELIVERED', 'CANCELLED']
      - name: gross_amount
        tests:
          - not_null
      - name: net_amount
        tests:
          - not_null

  - name: mart_daily_revenue
    description: "Business Mart: Daily rollup of gross & net revenue, order volume, and cancellation rates."
    columns:
      - name: report_date
        tests:
          - unique
          - not_null
      - name: total_orders
        tests:
          - not_null
      - name: net_revenue
        tests:
          - not_null

  - name: mart_customer_ltv
    description: "Business Mart: Customer lifetime value, tenure, RFM segment, and churn risk categorization."
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: lifetime_spend
        tests:
          - not_null
      - name: rfm_segment
        tests:
          - not_null
          - accepted_values:
              values: ['Champions', 'Loyal Customers', 'Recent Active', 'Needs Attention', 'At Risk / Churned']
      - name: churn_risk_band
        tests:
          - not_null
          - accepted_values:
              values: ['LOW', 'MEDIUM', 'HIGH']

  - name: mart_product_performance
    description: "Business Mart: Product velocity, margin generation, return/cancellation rates, and category rankings."
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: total_gross_margin
        tests:
          - not_null
