name: Medallion Platform CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  lint-and-test:
    name: SQLFluff Lint & Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-duckdb sqlfluff sqlfluff-templater-dbt pytest pydantic faker pandas requests

      - name: Populate Local Baseline Data
        run: |
          python tests/verify_ingestion_smoke.py

      - name: SQLFluff Lint
        run: |
          sqlfluff lint dbt/models/ --dialect duckdb

      - name: Pytest Unit & Integration Tests
        run: |
          pytest tests/ -v

  terraform-check:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  dbt-ci:
    name: dbt Build & Slim CI Validation
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt & Warehouse Adapters
        run: |
          pip install dbt-duckdb pydantic faker pandas requests

      - name: Ingest Baseline Data
        run: |
          python tests/verify_ingestion_smoke.py

      - name: dbt Build (CI Target)
        working-directory: dbt
        run: |
          export DBT_DUCKDB_PATH="../data/warehouse/lakehouse.duckdb"
          dbt build --target dev --profiles-dir .
